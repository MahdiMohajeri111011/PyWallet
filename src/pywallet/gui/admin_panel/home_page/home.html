<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

```
<title>PyWallet Admin</title>

<link rel="stylesheet" href="/admin/static/home/home.css">
```

</head>

<body>

<div class="admin-layout">

```
<aside class="sidebar">

    <div class="sidebar-header">
        <h2>PyWallet</h2>
        <span>Admin Panel</span>
    </div>

    <nav class="sidebar-nav">

        <a href="/admin/home" class="nav-item active">
            Dashboard
        </a>

        <a href="#users" class="nav-item">
            Users
        </a>

        <a href="#transactions" class="nav-item">
            Transactions
        </a>

    </nav>

    <div class="sidebar-footer">
        <button
            type="button"
            id="logout-button"
            class="logout-button"
        >
            Logout
        </button>
    </div>

</aside>


<main class="main-content">

    <header class="topbar">

        <div>
            <h1>Dashboard</h1>
            <p>PyWallet administration panel</p>
        </div>

        <div class="admin-user">
            Admin
        </div>

    </header>


    <section class="dashboard">

        <div class="stats-grid">

            <div class="stat-card">
                <span>Users</span>
                <strong id="users-count">0</strong>
            </div>

            <div class="stat-card">
                <span>Transactions</span>
                <strong id="transactions-count">0</strong>
            </div>

            <div class="stat-card">
                <span>Wallets</span>
                <strong id="wallets-count">0</strong>
            </div>

        </div>


        <section id="users" class="content-card">

            <div class="section-header">

                <div>
                    <h2>Users</h2>
                    <p>Manage PyWallet users.</p>
                </div>

                <button
                    type="button"
                    id="add-user-button"
                    class="primary-button"
                >
                    + Add user
                </button>

            </div>


            <div class="search-container">

                <input
                    type="text"
                    id="user-search"
                    placeholder="Search users..."
                >

            </div>


            <div class="table-container">

                <table>

                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Username</th>
                            <th>Super User</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="users-table-body">

                        <tr>
                            <td
                                colspan="4"
                                class="empty-row"
                            >
                                No users found.
                            </td>
                        </tr>

                    </tbody>

                </table>

            </div>

        </section>

    </section>

</main>
```

</div>

<div id="add-user-modal" class="modal hidden">

```
<div class="modal-overlay"></div>

<div class="modal-content">

    <div class="modal-header">

        <div>
            <h2>Add user</h2>
            <p>Create a new PyWallet user.</p>
        </div>

        <button
            type="button"
            id="close-modal-button"
            class="close-button"
        >
            ×
        </button>

    </div>


    <form id="add-user-form">

        <div class="form-group">

            <label for="new-username">
                Username
            </label>

            <input
                type="text"
                id="new-username"
                placeholder="Enter username"
                required
            >

        </div>


        <div class="form-group">

            <label for="new-password">
                Password
            </label>

            <input
                type="password"
                id="new-password"
                placeholder="Enter password"
                required
            >

        </div>


        <div class="checkbox-group">

            <input
                type="checkbox"
                id="new-is-super-user"
            >

            <label for="new-is-super-user">
                Super user
            </label>

        </div>


        <p
            id="form-error"
            class="form-error"
        ></p>


        <div class="modal-actions">

            <button
                type="button"
                id="cancel-button"
                class="secondary-button"
            >
                Cancel
            </button>

            <button
                type="submit"
                class="primary-button"
            >
                Create user
            </button>

        </div>

    </form>

</div>
```

</div>

<script src="/admin/static/home/home.js"></script>

</body>
</html>
